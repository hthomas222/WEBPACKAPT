replicaCount: 1

image:
  repository: webpackapt-web
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a service account token
  automateToken: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

service:
  type: NodePort
  port: 5000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
httpRoute:
  enabled: false
  # parentRefs: []
  # hostnames: []
  # rules: []
autoscaling:
  enabled: false